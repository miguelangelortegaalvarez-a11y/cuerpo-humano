  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }

  }
  .pantalla { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 3vh; padding: 2vh 3vw; }
  .pantalla.activa { display: flex; }

  h1 { margin: 0; font-size: clamp(34px, 9vw, 72px); color: #fff; text-shadow: 0 4px 0 #d97a1f, 0 0 18px #f3a64a; text-align: center; }
  h2 { margin: 0; font-size: clamp(24px, 6vw, 44px); text-align: center; }
  .oca-grande { font-size: clamp(90px, 24vw, 200px); line-height: 1; animation: bote 1.2s ease-in-out infinite; }
  @keyframes bote { 50% { transform: translateY(-14px); } }

  .boton {
    border: none; border-radius: 26px; padding: 2vh 4vw; font: inherit; font-size: clamp(26px, 6vw, 44px);
    color: #fff; cursor: pointer; box-shadow: 0 7px 0 rgba(0,0,0,.2); transition: transform .08s;
  }
  .boton:active { transform: translateY(5px); box-shadow: 0 2px 0 rgba(0,0,0,.2); }
  .numeros { display: grid; grid-template-columns: 1fr 1fr; gap: 3vw; width: min(90vw, 440px); }
  .numeros .boton { font-size: clamp(30px, 8vw, 54px); background: #e8742a; }
  .numeros .boton small { display: block; font-size: .42em; }

  /* --- tablero --- */
  #juego { justify-content: flex-start; gap: 1.5vh; padding-top: 1.5vh; }
  .barra { width: 100%; max-width: 640px; display: flex; align-items: center; gap: 3vw; }
  .salir { background: #fff; color: #d97a1f; border-radius: 50%; width: 50px; height: 50px; font-size: 24px; border: none; box-shadow: 0 4px 0 rgba(0,0,0,.15); flex: none; }
  .turno { flex: 1; background: #fff; border-radius: 20px; padding: .4em .7em; font-size: clamp(20px, 5vw, 32px); box-shadow: 0 4px 0 rgba(0,0,0,.1); text-align: center; }

  .tablero {
    display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr); gap: 3px;
    width: min(96vw, 62vh, 640px); aspect-ratio: 1; background: #7a4a22; padding: 5px; border-radius: 18px;
    box-shadow: 0 8px 0 #5a3416;
  }
  .casilla { position: relative; border-radius: 9px; background: #fff6df; display: flex; align-items: center; justify-content: center; overflow: visible; }
  .casilla:nth-child(odd) { background: #ffefc4; }
  .casilla .n { position: absolute; top: 1px; left: 3px; font-size: clamp(9px, 2.2vw, 14px); color: #a1825c; }
  .casilla .e { font-size: clamp(16px, 5vw, 32px); }
  .casilla.oca { background: #c9ecff; } .casilla.puente { background: #e0d4ff; } .casilla.posada { background: #ffd9b0; }
  .casilla.pozo { background: #b9d7ff; } .casilla.laberinto { background: #c8f0c0; } .casilla.carcel { background: #d8d8d8; }
  .casilla.dados { background: #ffe1f0; } .casilla.trex { background: #ffb3b3; } .casilla.meta { background: #ffd54a; } .casilla.salida { background: #b7f0b7; }
  .fichas { position: absolute; inset: 0; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; pointer-events: none; }
  .ficha { font-size: clamp(15px, 4.4vw, 30px); line-height: 1; border-radius: 50%; padding: 1px; filter: drop-shadow(0 2px 0 rgba(0,0,0,.35)); }
  .ficha.mueve { animation: hop .18s ease-out; }
  @keyframes hop { 50% { transform: translateY(-40%) scale(1.25); } }

  .dado { font-size: clamp(60px, 16vw, 110px); line-height: 1; }
  .dado.rueda { animation: rueda .1s linear infinite; }
  @keyframes rueda { 50% { transform: rotate(20deg) scale(1.1); } }

  /* --- ventana de pregunta / avisos --- */
  .velo { position: absolute; inset: 0; background: rgba(60,35,10,.45); display: none; align-items: flex-end; justify-content: center; z-index: 5; }
  .velo.activa { display: flex; }
  .hoja {
    width: 100%; max-width: 640px; background: #fffaf0; border-radius: 30px 30px 0 0; padding: 2.5vh 4vw 4vh;
    display: flex; flex-direction: column; align-items: center; gap: 2.2vh; animation: sube .25s ease-out;
  }
  @keyframes sube { from { transform: translateY(60%); } }
  .quien { font-size: clamp(22px, 5.5vw, 36px); }
  .pregunta { font-size: clamp(56px, 15vw, 120px); white-space: nowrap; }
  .pregunta .hueco { color: #e8742a; }
  .respuestas { display: grid; grid-template-columns: 1fr 1fr; gap: 2vh 4vw; width: min(92vw, 520px); }
  .resp { background: #3a8fd1; font-size: clamp(38px, 10vw, 72px); padding: 1.2vh 0; }
  .resp.mal { background: #ff6b6b; animation: tiembla .4s; }
  .resp.bien { background: #22b07d; }
  @keyframes tiembla { 20%, 60% { transform: translateX(-10px); } 40%, 80% { transform: translateX(10px); } }
  .tirar { background: #22b07d; width: min(80vw, 420px); }
  .aviso-emoji { font-size: clamp(70px, 20vw, 140px); line-height: 1; }
  .aviso-texto { font-size: clamp(24px, 6vw, 42px); text-align: center; }
  .saltos { font-size: clamp(22px, 5.5vw, 36px); color: #e8742a; text-align: center; min-height: 1.3em; }

  .podio { font-size: clamp(26px, 6vw, 42px); background: #fff; border-radius: 26px; padding: 2vh 7vw; box-shadow: 0 7px 0 rgba(0,0,0,.12); text-align: center; line-height: 1.5; }
</style>

<body>

<!-- INICIO -->
<section id="inicio" class="pantalla activa">
  <div class="oca-grande">🪿</div>
  <h1>La Oca de las tablas</h1>
  <h2>Tabla del 2<br>🦕 tú contra el 🦖 T-Rex</h2>
  <button class="boton tirar" id="jugar">¡A jugar!</button>
</section>

<!-- JUEGO -->
<section id="juego" class="pantalla">
  <div class="barra">
    <button class="salir" id="salir">✕</button>
    <div class="turno" id="turno"></div>
  </div>
  <div class="tablero" id="tablero"></div>
</section>

<!-- FINAL -->
<section id="final" class="pantalla">
  <div class="oca-grande" id="ganador"></div>
  <h1 id="titulo-final"></h1>
  <div class="podio" id="podio"></div>
  <button class="boton tirar" id="otra">Otra partida</button>
</section>

<div class="velo" id="velo"><div class="hoja" id="hoja"></div></div>

<script>
const $ = id => document.getElementById(id);
const esperar = ms => new Promise(r => setTimeout(r, ms));
function barajar(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; }

// ---------- sonido ----------
let audio;
function tono(frec, dur = .12, tipo = 'sine', cuando = 0, vol = .22) {
  audio = audio || new (window.AudioContext || window.webkitAudioContext)();
  const t = audio.currentTime + cuando;
  const o = audio.createOscillator(), g = audio.createGain();
  o.type = tipo; o.frequency.setValueAtTime(frec, t);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
  o.connect(g).connect(audio.destination); o.start(t); o.stop(t + dur);
}
const sPaso = i => tono(380 + (i % 6) * 50, .09, 'triangle');
const sBien = () => [523, 659, 784, 1046].forEach((f, i) => tono(f, .18, 'sine', i * .09));
const sMal = () => { tono(220, .2, 'square', 0, .1); tono(180, .3, 'square', .15, .1); };
const sDado = () => tono(600 + Math.random() * 400, .03, 'square', 0, .06);
const sOca = () => [700, 900, 700, 900].forEach((f, i) => tono(f, .1, 'sawtooth', i * .1, .08));
const sRugido = () => { tono(90, .7, 'sawtooth', 0, .3); tono(70, .8, 'square', .05, .2); };

// ---------- casillas de la Oca clásica ----------
const OCAS = [5, 9, 14, 18, 23, 27, 32, 36, 41, 45, 50, 54, 59];
const ESPECIAL = {
  6:  { c: 'puente', e: '🌉' }, 12: { c: 'puente', e: '🌉' },
  19: { c: 'posada', e: '🏠' }, 31: { c: 'pozo', e: '🕳️' },
  42: { c: 'laberinto', e: '🌀' }, 52: { c: 'carcel', e: '🔒' },
  26: { c: 'dados', e: '🎲' }, 53: { c: 'dados', e: '🎲' },
  58: { c: 'trex', e: '🌋' }, 63: { c: 'meta', e: '🏆' }, 0: { c: 'salida', e: '🏁' },
};
OCAS.forEach(n => ESPECIAL[n] = { c: 'oca', e: '🪿' });

const FICHAS = ['🦕', '🐸', '🐙', '🦄'];
const NOMBRES = ['Tú'];
let jugadores, turno, celdas, ocupado, partida = 0;

function pintarTablero() {
  const t = $('tablero'); t.innerHTML = ''; celdas = [];
  for (let i = 0; i < 64; i++) celdas.push(null);
  // en zigzag desde abajo a la izquierda: 0 = salida, 63 = meta
  const orden = [];
  for (let i = 0; i < 64; i++) {
    const fila = Math.floor(i / 8); let col = i % 8;
    if (fila % 2) col = 7 - col;
    orden.push({ i, fila: 8 - fila, col: col + 1 });
  }
  orden.forEach(({ i, fila, col }) => {
    const d = document.createElement('div');
    const esp = ESPECIAL[i];
    d.className = 'casilla' + (esp ? ' ' + esp.c : '');
    d.style.gridRow = fila; d.style.gridColumn = col;
    d.innerHTML = `${i && i < 63 ? `<span class="n">${i}</span>` : ''}${esp ? `<span class="e">${esp.e}</span>` : ''}<div class="fichas"></div>`;
    t.appendChild(d); celdas[i] = d;
  });
}

function pintarFichas(mueve) {
  celdas.forEach(c => c.querySelector('.fichas').innerHTML = '');
  jugadores.forEach((j, n) => {
    const f = document.createElement('span');
    f.className = 'ficha' + (n === mueve ? ' mueve' : '');
    f.textContent = j.ficha;
    celdas[j.pos].querySelector('.fichas').appendChild(f);
  });
}

function pintarTurno() {
  const j = jugadores[turno];
  $('turno').textContent = j.robot ? 'Turno del 🦖 T-Rex' : '🦕 ¡Te toca!';
}

function empezar(n) {
  partida++;
  jugadores = [];
  for (let i = 0; i < n; i++) jugadores.push({ ficha: FICHAS[i], nombre: NOMBRES[i], pos: 0, castigo: 0, robot: false });
  if (n === 1) jugadores.push({ ficha: '🦖', nombre: 'T-Rex', pos: 0, castigo: 0, robot: true });
  turno = 0;
  mostrar('juego'); pintarTablero(); pintarFichas(); bucle();
}

function mostrar(id) { document.querySelectorAll('.pantalla').forEach(p => p.classList.toggle('activa', p.id === id)); }

// ---------- ventana inferior ----------
function hoja(html) { $('hoja').innerHTML = html; $('velo').classList.add('activa'); }
function cerrarHoja() { $('velo').classList.remove('activa'); }
function aviso(emoji, texto, ms = 1900) {
  hoja(`<div class="aviso-emoji">${emoji}</div><div class="aviso-texto">${texto}</div>`);
  return esperar(ms).then(cerrarHoja);
}

// ---------- pregunta ----------
function nuevaOperacion() { return { t: 2, k: 1 + (Math.random() * 10 | 0) }; }
function opciones(t, k) {
  const r = t * k;
  const cand = new Set([r + t, r - t, r + 1, r - 1, t + k, r + 2, r - 2]);
  return barajar([r, ...barajar([...cand].filter(x => x > 0 && x !== r)).slice(0, 3)]);
}

function preguntar(j) {
  const { t, k } = nuevaOperacion(), r = t * k;
  return new Promise(resolver => {
    hoja(`<div class="quien">${j.robot ? '🦖 Le toca al T-Rex' : '🦕 ¡Te toca!'}</div>
      <div class="pregunta" id="preg">${t} × ${k} = <span class="hueco">?</span></div>
      <div class="saltos" id="saltos"></div>
      <div class="respuestas" id="resps"></div>`);
    const cont = $('resps'); let hecho = false;
    opciones(t, k).forEach(n => {
      const b = document.createElement('button');
      b.className = 'boton resp'; b.textContent = n;
      b.onclick = async () => {
        if (hecho) return; hecho = true;
        $('preg').innerHTML = `${t} × ${k} = <span class="hueco">${r}</span>`;
        if (n === r) { b.classList.add('bien'); sBien(); await esperar(900); resolver(true); }
        else {
          b.classList.add('mal'); sMal();
          [...cont.children].find(x => +x.textContent === r).classList.add('bien');
          // enseña los saltos: 3, 6, 9, 12…
          const s = $('saltos');
          for (let i = 1; i <= k; i++) { s.textContent = Array.from({ length: i }, (_, x) => (x + 1) * t).join(' · '); sPaso(i); await esperar(380); }
          await esperar(1400); resolver(false);
        }
      };
      cont.appendChild(b);
    });
    // el T-Rex contesta solo (acierta 2 de cada 3)
    if (j.robot) setTimeout(() => {
      const bs = [...cont.children], ok = Math.random() < .67;
      (ok ? bs.find(x => +x.textContent === r) : bs.find(x => +x.textContent !== r)).click();
    }, 1400);
  });
}

function tirarDado(j, atras) {
  return new Promise(resolver => {
    hoja(`<div class="quien">${atras ? (j.robot ? '🦖 El T-Rex va hacia atrás' : '🦕 Tira… y vas hacia atrás') : (j.robot ? '🦖 El T-Rex tira' : '🦕 ¡Muy bien! Tira el dado')}</div>
      <div class="dado" id="dado">🎲</div>
      <button class="boton tirar" id="tirar" style="background:${atras ? '#e8742a' : '#22b07d'}">Tirar</button>`);
    const go = async () => {
      $('tirar').disabled = true; $('tirar').style.visibility = 'hidden';
      const d = $('dado'); d.classList.add('rueda');
      const caras = ['⚀', '⚁', '⚂', '⚃', '⚄', '⚅'];
      for (let i = 0; i < 12; i++) { d.textContent = caras[Math.random() * 6 | 0]; sDado(); await esperar(70); }
      const v = 1 + (Math.random() * 6 | 0);
      d.classList.remove('rueda'); d.textContent = caras[v - 1];
      $('tirar').textContent = v; $('tirar').style.visibility = 'visible';
      await esperar(1000); cerrarHoja(); resolver(v);
    };
    $('tirar').onclick = go;
    if (j.robot) setTimeout(go, 900);
  });
}

async function mover(n, hasta) {
  const j = jugadores[n], paso = hasta > j.pos ? 1 : -1;
  while (j.pos !== hasta) { j.pos += paso; pintarFichas(n); sPaso(j.pos); await esperar(200); }
}

async function avanzar(n, v) {
  const j = jugadores[n];
  let destino = j.pos + v;
  if (destino > 63) {   // rebota en la meta
    await mover(n, 63); destino = 63 - (destino - 63);
  }
  await mover(n, destino);
}

// aplica la casilla; devuelve true si vuelve a tirar
async function casilla(n) {
  const j = jugadores[n], p = j.pos;
  if (OCAS.includes(p)) {
    const sig = OCAS.find(o => o > p);
    sOca();
    if (sig) { await aviso('🪿', 'De oca a oca<br>y tiro porque me toca'); await mover(n, sig); }
    else { await aviso('🪿', '¡Oca! Vuelves a tirar'); }
    return true;
  }
  switch (p) {
    case 6: case 12: { const o = p === 6 ? 12 : 6; sOca(); await aviso('🌉', 'De puente a puente<br>y tiro porque me lleva la corriente'); await mover(n, o); return true; }
    case 26: case 53: { const o = p === 26 ? 53 : 26; sOca(); await aviso('🎲', 'De dado a dado<br>y tiro porque me ha tocado'); await mover(n, o); return true; }
    case 19: j.castigo = 1; await aviso('🏠', 'La posada<br>Descansas 1 turno'); return false;
    case 31: j.castigo = 2; await aviso('🕳️', '¡Al pozo!<br>2 turnos sin jugar'); return false;
    case 52: j.castigo = 2; await aviso('🔒', 'La cárcel<br>2 turnos sin jugar'); return false;
    case 42: await aviso('🌀', '¡El laberinto!<br>Vuelves a la 30'); await mover(n, 30); return false;
    case 58: sRugido(); await aviso('🌋', '¡BUUUM! El volcán<br>Vuelves a la salida', 2400); await mover(n, 0); return false;
  }
  return false;
}

// ---------- bucle de turnos ----------
async function bucle() {
  const yo = partida;
  while (yo === partida) {
    const j = jugadores[turno];
    pintarTurno();
    if (j.castigo) {
      j.castigo--;
      await aviso(j.ficha, j.robot ? 'El T-Rex descansa' : 'Descansas este turno');
    } else {
      let otraVez = true;
      while (otraVez && yo === partida) {
        otraVez = false;
        const acierto = await preguntar(j);
        if (yo !== partida) return;
        const v = await tirarDado(j, !acierto);
        if (yo !== partida) return;
        if (acierto) await avanzar(turno, v);
        else await mover(turno, Math.max(0, j.pos - v));
        if (j.pos === 63) return ganar(j);
        otraVez = await casilla(turno);
        if (yo !== partida) return;
      }
    }
    if (yo !== partida) return;
    turno = (turno + 1) % jugadores.length;
    await esperar(300);
  }
}

function ganar(j) {
  sBien(); setTimeout(sBien, 500);
  $('ganador').textContent = j.ficha;
  $('titulo-final').textContent = j.robot ? '¡Ha ganado el T-Rex!' : '¡Has ganado!';
  $('podio').innerHTML = [...jugadores].sort((a, b) => b.pos - a.pos)
    .map(x => `${x.ficha} ${x.pos === 63 ? '🏆' : 'casilla ' + x.pos}`).join('<br>');
  setTimeout(() => mostrar('final'), 1200);
}

$('jugar').onclick = () => empezar(1);
$('salir').onclick = () => { partida++; cerrarHoja(); mostrar('inicio'); };
$('otra').onclick = () => mostrar('inicio');
</script>
